[project]
name = "youtube-study"
version = "0.1.0"
description = "Local YouTube scene capture and multi-language subtitle Markdown app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.4",
    "pillow>=10.4.0",
    "playwright>=1.45.0",
    "uvicorn[standard]>=0.30.0",
    "yt-dlp>=2024.8.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
